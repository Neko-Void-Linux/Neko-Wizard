name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: codeberg-small
    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'

    steps:
      - name: Install Node.js and dependencies
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps
          xbps-install -yu --repository=https://repo-de.voidlinux.org/current/
          xbps-install -y --repository=https://repo-de.voidlinux.org/current/ nodejs gcc make cmake meson ninja gtk4-devel pkg-config xxd sed coreutils tar

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile project
        run: meson setup build && meson compile -C build 

      - name: Create tarball
        run: tar -cvf package-neko.tar *

      - name: Upload artifact
        uses: forgejo/upload-artifact@v1  # Cambiado de actions/ a forgejo/
        with:
          name: installer-package
          path: package-neko.tar  # Solo el archivo específico, no ./